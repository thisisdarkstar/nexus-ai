<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="nx-bg" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#0f233a" />
      <stop offset="65%" stop-color="#07101f" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="nx-shield-stroke" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="nx-shield-fill" x1="32" y1="10" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="nx-n-core" x1="21" y1="22" x2="43" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Obsidian app container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#nx-bg)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="1.5" />

  <!-- Hex cyber shield perimeter -->
  <path
    d="M32 9.5L51.5 17.5V32C51.5 43.2 43.1 51.6 32 55.2C20.9 51.6 12.5 43.2 12.5 32V17.5L32 9.5Z"
    fill="url(#nx-shield-fill)"
    stroke="url(#nx-shield-stroke)"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Neural N glyph -->
  <path
    d="M23 41.5V22.5L41 41.5V22.5"
    stroke="url(#nx-n-core)"
    stroke-width="4.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Core lattice vertices -->
  <circle cx="23" cy="22.5" r="2.6" fill="#7dd3fc" />
  <circle cx="41" cy="41.5" r="2.6" fill="#34d399" />
  <circle cx="32" cy="14" r="1.8" fill="#10b981" />
</svg>
